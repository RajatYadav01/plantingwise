services:
  api:
    # Root build context is needed because the API depends on packages/* workspaces.
    build:
      context: .
      dockerfile: apps/api/v1/Dockerfile
    env_file:
      - ./apps/api/v1/.env
    environment:
      # Local HTTP demos need non-Secure cookies; deploy with NODE_ENV=production behind HTTPS.
      NODE_ENV: development
      PORT: 4000
    ports:
      - "4000:4000"
    restart: unless-stopped

  mobile-web:
    # Builds the Expo web target; EXPO_PUBLIC_API_URL is embedded at build time.
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "8081:80"
    depends_on:
      - api
    restart: unless-stopped