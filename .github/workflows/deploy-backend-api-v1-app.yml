name: Deploy Backend API v1 App

on:
  workflow_run:
    workflows: ["All Checks"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy-backend-api-v1-app:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: backend-api-v1-deploy
      cancel-in-progress: false

    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch')
    steps:
      - name: Apply production database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate

      - name: Seed sample production data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
          ALLOW_DEMO_SEED: ${{ secrets.ALLOW_DEMO_SEED }}
        run: pnpm db:seed

      - name: Trigger Render Deployment via Deploy Hook
        # Send an empty POST request to Render's internal secure URL string
        run: |
          curl -X POST "${{ secrets.API_V1_RENDER_DEPLOY_HOOK_URL }}"