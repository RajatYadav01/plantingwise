# Expo Router uses client-side navigation; serve index.html for deep-linked web routes.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Static assets can be cached because Expo export filenames include content hashes.
  location /_expo/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}